name: Deploy Websites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # This host-mode runner must be installed on the Linux server that owns
    # the target directory and must have write permission there.
    runs-on: linux-deploy
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v4

      - name: Copy the application into public_html
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          mkdir -p "$TARGET"
          # Deploy content without attempting to replace the web-server
          # account's existing ownership or file-mode settings.
          rsync -rl \
            --no-owner \
            --no-group \
            --no-perms \
            --no-times \
            --exclude='.git/' \
            --exclude='.gitea/' \
            --exclude='.lh/' \
            --exclude='data/*.db' \
            --exclude='data/*.db-*' \
            ./ "$TARGET/"

      - name: Rename deployed Apache override files
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          # Rename only .htaccess files below this deployment target. -xdev
          # prevents the cleanup from crossing into a separately mounted path.
          # Stop rather than overwrite an existing non-hidden htaccess file.
          while IFS= read -r -d '' source; do
            destination="${source%/.htaccess}/htaccess"
            if [ -e "$destination" ]; then
              echo "Refusing to overwrite existing file: $destination" >&2
              exit 1
            fi
            echo "Renaming $source -> $destination"
            mv -- "$source" "$destination"
          done < <(find "$TARGET" -xdev -type f -name '.htaccess' -print0)
