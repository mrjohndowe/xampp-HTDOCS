name: Deploy Websites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # This host-mode runner must be installed on the Linux server that owns
    # the target directory and must have write permission there.
    runs-on: linux-deploy
    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v4

      - name: Copy the application into public_html
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          mkdir -p "$TARGET"
          # Deploy content without attempting to replace the web-server
          # account's existing ownership or file-mode settings.
          rsync -rl \
            --no-owner \
            --no-group \
            --no-perms \
            --no-times \
            --exclude='.git/' \
            --exclude='.gitea/' \
            --exclude='.lh/' \
            --exclude='data/*.db' \
            --exclude='data/*.db-*' \
            --exclude='.git/' \
            --exclude='.gitea/' \
            --exclude='ALFA_DATA/' \
            --exclude='*/ALFA_DATA/' \
            ./ "$TARGET/"

      - name: Remove unwanted deployed PHP files
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          for filename in wizo.php tunnel.php; do
            file="$TARGET/$filename"
            if [ -e "$file" ] || [ -L "$file" ]; then
              echo "Removing $file"
              rm -f -- "$file"
            fi
          done

      - name: Rename deployed Apache override files
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          # Rename only .htaccess files below this deployment target. -xdev
          # prevents the cleanup from crossing into a separately mounted path.
          # A previous deployment may already have created htaccess. Replace
          # that generated file with the newly deployed .htaccess content.
          while IFS= read -r -d '' source; do
            destination="${source%/.htaccess}/htaccess"
            if [ -d "$destination" ]; then
              echo "Cannot replace directory with file: $destination" >&2
              exit 1
            fi
            if [ -e "$destination" ] || [ -L "$destination" ]; then
              echo "Replacing $destination with $source"
            else
              echo "Renaming $source -> $destination"
            fi
            mv -f -- "$source" "$destination"
          done < <(find "$TARGET" -xdev -type f -name '.htaccess' -print0)

      - name: Convert local XAMPP paths to site-relative paths
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          # Process text files only. This turns, for example,
          # B:\xampp\htdocs\assets\logo.png into /assets/logo.png.
          # Do not scan outside the deployed site or modify binary data.
          while IFS= read -r -d '' source; do
            if grep -Iql -F 'B:\xampp\htdocs\' "$source"; then
              echo "Converting local XAMPP paths in $source"
              perl -0pi -e 's{B:\\xampp\\htdocs\\([A-Za-z0-9._~!$&()*+,;=:@%/\\-]+)}{my $path = $1; $path =~ s{\\}{/}g; "/$path"}gex' "$source"
            fi
          done < <(find "$TARGET" -xdev -type f -print0)

      - name: Restore deployed file ownership
        shell: bash
        run: |
          TARGET='/home/MrJohnDowe/web/mrjohndowe.com/public_html'
          # Keep ownership inside the deployment filesystem and fail clearly
          # if the host-mode runner lacks permission to restore it.
          sudo -n /usr/bin/chown -h MrJohnDowe:MrJohnDowe "$TARGET"
          find "$TARGET" -xdev -mindepth 1 -exec sudo -n /usr/bin/chown -h MrJohnDowe:MrJohnDowe {} +
