<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080b16"></stop>
    <stop offset="45%" stop-color="#221044"></stop>
    <stop offset="100%" stop-color="#74153e"></stop>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#67e8f9"></stop>
    <stop offset="30%" stop-color="#a78bfa"></stop>
    <stop offset="65%" stop-color="#fb7185"></stop>
    <stop offset="100%" stop-color="#67e8f9"></stop>
  </linearGradient>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>

  <style>
    .trim {
      stroke-dasharray: 130 35;
      animation: run 3s linear infinite;
    }

    .screen {
      opacity:0;
      animation-duration:20s;
      animation-iteration-count:infinite;
    }

    #m1 { animation-name:m1; }
    #m2 { animation-name:m2; }
    #m3 { animation-name:m3; }
    #m4 { animation-name:m4; }

    @keyframes run {
      to { stroke-dashoffset:-330; }
    }

    @keyframes m1 {
      0%,22% {opacity:1}
      25%,100% {opacity:0}
    }

    @keyframes m2 {
      0%,24% {opacity:0}
      25%,47% {opacity:1}
      50%,100% {opacity:0}
    }

    @keyframes m3 {
      0%,49% {opacity:0}
      50%,72% {opacity:1}
      75%,100% {opacity:0}
    }

    @keyframes m4 {
      0%,74% {opacity:0}
      75%,97% {opacity:1}
      100% {opacity:0}
    }
  </style>
</defs>

<!-- background -->
<rect width="1080" height="1350" rx="55" fill="url(#bg)"></rect>

<!-- flair -->
<text x="85" y="120" font-size="58">✨</text>
<text x="920" y="125" font-size="55">💬</text>
<text x="85" y="1240" font-size="60">💅</text>
<text x="915" y="1240" font-size="60">✨</text>

<!-- phone -->
<rect x="130" y="125" width="820" height="1100" rx="95" fill="#05070d" stroke="#27272a" stroke-width="12"></rect>

<!-- glowing animated trim -->
<rect x="145" y="140" width="790" height="1070" rx="82" fill="none" stroke="url(#neon)" stroke-width="8" class="trim" filter="url(#glow)"></rect>

<!-- top bar -->
<text x="540" y="215" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Messages</text>

<circle cx="540" cy="165" r="7" fill="#22c55e"></circle>

<!-- MESSAGE 2 -->
<g id="m2" class="screen">
  <rect x="205" y="310" width="670" height="600" rx="65" fill="#303034"></rect>

  <text x="540" y="410" text-anchor="middle" fill="#f472b6" font-family="Arial" font-size="65" font-weight="900">WAIT...</text>

  <text x="540" y="515" text-anchor="middle" fill="#fff" font-family="Arial" font-size="39">you used to not like</text>

  <text x="540" y="575" text-anchor="middle" fill="#fff" font-family="Arial" font-size="39">being touched in an</text>

  <text x="540" y="635" text-anchor="middle" fill="#fff" font-family="Arial" font-size="39">intimate way...</text>

  <text x="540" y="735" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="42" font-weight="700">but I guess now you do...</text>

  <text x="540" y="815" text-anchor="middle" fill="#fda4af" font-family="Arial" font-size="47" font-weight="900">just not with me, right?</text>

  <text x="540" y="1010" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="34" font-style="italic">oh... okay. noted 💔</text>
</g>

<!-- MESSAGE 3 -->
<g id="m3" class="screen">
  <rect x="225" y="375" width="630" height="420" rx="65" fill="#0a84ff"></rect>

  <text x="540" y="500" text-anchor="middle" fill="#fff" font-family="Arial" font-size="55" font-weight="900">SOOO...</text>

  <text x="540" y="600" text-anchor="middle" fill="#fff" font-family="Arial" font-size="44">I got the memo 😭</text>

  <text x="540" y="685" text-anchor="middle" fill="#fff" font-family="Arial" font-size="47" font-weight="900">I’ll act accordingly 💅</text>

  <text x="540" y="915" text-anchor="middle" fill="#fbcfe8" font-family="Arial" font-size="35" font-style="italic">no mixed signals over here ✨</text>
</g>

<!-- MESSAGE 4 -->
<g id="m4" class="screen">
  <rect x="205" y="350" width="670" height="480" rx="65" fill="#303034"></rect>

  <text x="540" y="475" text-anchor="middle" fill="#f472b6" font-family="Arial" font-size="57" font-weight="900">ANYWAY...</text>

  <text x="540" y="585" text-anchor="middle" fill="#fff" font-family="Arial" font-size="46">flirting privileges:</text>

  <text x="540" y="685" text-anchor="middle" fill="#fb7185" font-family="Arial" font-size="80" font-weight="900">REVOKED 😂</text>

  <text x="540" y="930" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="36" font-style="italic">we love clarity around here ✨</text>
</g>

<!-- MESSAGE 1 -->
<g id="m1" class="screen">
  <rect x="225" y="340" width="630" height="500" rx="65" fill="#0a84ff"></rect>

  <text x="540" y="480" text-anchor="middle" fill="#fff" font-family="Arial" font-size="125" font-weight="900">NVM</text>

  <text x="540" y="590" text-anchor="middle" fill="#fff" font-family="Arial" font-size="48" font-weight="700">on the flirting &amp;</text>

  <text x="540" y="665" text-anchor="middle" fill="#fff" font-family="Arial" font-size="55" font-weight="900">ROLEPLAYING</text>

  <text x="540" y="745" text-anchor="middle" fill="#fff" font-family="Arial" font-size="55" font-weight="900">WITH ME 😌</text>

  <text x="540" y="940" text-anchor="middle" fill="#f9a8d4" font-family="Arial" font-size="35" font-style="italic">respectfully... never mind 😂</text>
</g>

<!-- home indicator -->
<rect x="430" y="1160" width="220" height="9" rx="5" fill="#eee"></rect>
</svg>
