const boot=document.createElement('script');boot.textContent="(()=>{const search=document.querySelector('[data-log-search]');if(search)search.addEventListener('input',()=>{let n=0;document.querySelectorAll('[data-log-row]').forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(search.value.toLowerCase());if(!r.hidden)n++});document.querySelector('#search-status').textContent=n+' matching entries'});(()=>{const form=document.querySelector('#reflection');if(!form)return;\nconst Q=[[\"madAbout\", \"What did I get mad about?\", \"Describe what happened and what triggered your anger.\"], [\"express\", \"How did I express my anger?\", \"Think about your words, tone, and body language.\"], [\"angerScale\", \"How angry did I feel?\", \"Choose from 1 (not at all) to 10 (very, very angry).\"], [\"thoughts\", \"What were my thoughts?\", \"What was going through your mind?\"], [\"feelings\", \"What were my feelings?\", \"Describe what you felt, including feelings underneath the anger.\"], [\"act\", \"How did I act?\", \"What did you do or say?\"], [\"better\", \"What could I have done better?\", \"Choose one thing you could try differently next time.\"], [\"public\", \"Would I like to make this log public?\", \"Choose a visibility option, then review your answers before saving.\"]],box=document.querySelector('#questions');let step=0,submitted=false;\nconst old=window.reflectionOld||{};\nQ.forEach(([name,title,hint],i)=>{const f=document.createElement('fieldset');f.hidden=i!==0;const l=document.createElement('legend');const req=document.createElement('span');req.className='required';req.textContent='Required';l.append(req,document.createTextNode(title));const p=document.createElement('p');p.className='hint';p.id='hint-'+name;p.textContent=hint;f.append(l,p);\nif(name==='public'||name==='angerScale'){const c=document.createElement('div');c.className='choices'+(name==='public'?' privacy':'');const vals=name==='public'?['0','1']:Array.from({length:10},(_,i)=>'option'+(i+1));vals.forEach((v,j)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name=name;input.value=v;input.required=true;input.checked=old[name]===v;input.setAttribute('aria-describedby',p.id);const s=document.createElement('span');if(name==='public'){s.textContent=j?'Make this log public':'Keep this log private';const sm=document.createElement('small');sm.textContent=j?'Share your displayed name and all answers in the public log.':'Do not include this entry in the public log.';s.append(sm)}else{s.textContent=j+1;input.setAttribute('aria-label',(j+1)+' out of 10')}label.append(input,s);c.append(label)});f.append(c);if(name==='public'){const w=document.createElement('p');w.className='warning';w.textContent='Public entries include your displayed name and every answer. Remove any details you do not want to share. Private entries are not listed publicly, but are not encrypted.';const r=document.createElement('div');r.id='review';r.className='review';f.append(w,r)}}else{const t=document.createElement('textarea');t.name=name;t.required=true;t.maxLength=4000;t.value=typeof old[name]==='string'?old[name]:'';t.placeholder='Write your answer here\u2026';t.setAttribute('aria-label',title);t.setAttribute('aria-describedby',p.id);const count=document.createElement('div');count.className='count';const update=()=>count.textContent=t.value.length.toLocaleString()+' / 4,000';t.addEventListener('input',update);update();f.append(t,count)}box.append(f)});\nconst fields=[...box.children],list=document.querySelector('#stepList');Q.forEach((q,i)=>{const li=document.createElement('li');const d=document.createElement('span');d.className='dot';d.textContent=i+1;li.append(d,document.createTextNode(['The trigger','Expression','Intensity','Thoughts','Feelings','Actions','Next time','Visibility & review'][i]));list.append(li)});\nfunction value(name){if(name==='public'||name==='angerScale')return form.querySelector('input[name=\"'+name+'\"]:checked')?.value||'';return form.elements[name].value.trim()}\nfunction valid(i){return !!value(Q[i][0])}\nfunction review(){const r=document.querySelector('#review');r.replaceChildren();Q.slice(0,7).forEach(([name,title],i)=>{const d=document.createElement('div');d.className='answer';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=name==='angerScale'?value(name).replace('option','')+' / 10':value(name);const b=document.createElement('button');b.type='button';b.textContent='Edit answer';b.setAttribute('aria-label','Edit: '+title);b.addEventListener('click',()=>show(i));d.append(h,p,b);r.append(d)})}\nfunction show(i,focus=true){step=i;fields.forEach((f,j)=>f.hidden=i!==j);document.querySelector('#stepText').textContent='Question '+(i+1)+' of 8';document.querySelector('#progress').value=i+1;document.querySelector('#back').disabled=i===0;document.querySelector('#next').textContent=i===7?'Save reflection':'Continue \u2192';document.querySelector('#wizard-error').textContent='';[...list.children].forEach((li,j)=>{li.className=i===j?'current':j<i?'done':'';if(i===j)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current')});if(i===7)review();if(focus)fields[i].querySelector('textarea,input').focus()}\ndocument.querySelector('#back').addEventListener('click',()=>show(Math.max(0,step-1)));\nform.addEventListener('submit',e=>{e.preventDefault();if(submitted)return;if(!valid(step)){document.querySelector('#wizard-error').textContent=step===7?'Please choose private or public before saving.':'Please answer this question before continuing.';fields[step].querySelector('textarea,input').focus();return}if(step<7){show(step+1);return}for(let i=0;i<8;i++){if(!valid(i)){show(i);document.querySelector('#wizard-error').textContent='This answer is required.';return}}\nif(document.body.dataset.demo==='true'){document.querySelector('#wizardPanel').innerHTML='<div class=\"empty\"><div class=\"eyebrow\">Preview complete</div><h2>You made space to reflect.</h2><p>Nothing was saved or published. Your selection was '+(value('public')==='1'?'public':'private')+'.</p><a class=\"btn primary\" href=\"#treatment\">Start again</a></div>';submitted=true;return}\nsubmitted=true;document.querySelector('#next').disabled=true;document.querySelector('#next').textContent='Saving\u2026';form.submit()});\nwindow.addEventListener('beforeunload',e=>{if(!submitted&&Q.slice(0,7).some(([n])=>value(n))){e.preventDefault();e.returnValue=''}});show(0,false);\n})();})();";main.append(boot);document.querySelector('#site-nav').classList.remove('open');document.querySelector('[data-menu]').setAttribute('aria-expanded','false');main.focus();}
